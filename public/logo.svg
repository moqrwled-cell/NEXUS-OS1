<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" width="560" height="100">
  <defs>
    <!-- Primary Brand Gradient -->
    <linearGradient id="hzShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Wordmark Accent Gradient -->
    <linearGradient id="hzTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Ambient Shadow for Icon Mark -->
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00F5D4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Standalone Shield & Nexus Glyph Icon (Scaled for Horizontal Alignment) -->
  <g transform="translate(6, 6)" filter="url(#hzGlow)">
    <!-- Shield Container -->
    <path 
      d="M 44 8 
         L 72 22 
         C 75 23 76 26 76 29 
         L 76 54 
         C 76 72 61 87 44 93 
         C 27 87 12 72 12 54 
         L 12 29 
         C 12 26 13 23 16 22 
         Z" 
      fill="#04090E" 
      stroke="url(#hzShieldGrad)" 
      stroke-width="3" 
      stroke-linejoin="round" 
    />

    <!-- Inner Nexus "N" Pillars -->
    <path d="M 28 34 L 28 66" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <path d="M 28 34 L 60 66" stroke="url(#hzShieldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 34 L 60 66" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Core Diamond Verification Key -->
    <polygon points="44,46 48,50 44,54 40,50" fill="#00F5D4" />
  </g>

  <!-- Right: Institutional Typography Hierarchy -->
  <g transform="translate(102, 0)">
    <!-- Primary Brand Line: NEXUS CONTRACTGUARD™ -->
    <text x="0" y="52" font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.03em" fill="#FFFFFF">
      NEXUS <tspan fill="url(#hzTextGrad)">CONTRACTGUARD</tspan><tspan font-size="16" font-weight="600" fill="#00F5D4" dy="-14">™</tspan>
    </text>

    <!-- Sub-Brand Descriptor: ABA Model Rule 1.6 Compliant Positioning -->
    <text x="2" y="76" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-weight="600" font-size="10.5" letter-spacing="0.22em" fill="#94A3B8">
      AIR-GAPPED LEGAL AUDIT STUDIO · ZERO CLOUD EXPOSURE
    </text>
  </g>
</svg>
