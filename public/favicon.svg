<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Optical bold capsule arms radiating at 60 deg increments -->
  <g fill="url(#favGrad)">
    <rect x="86" y="10" width="28" height="52" rx="14" transform="rotate(0 100 100)" />
    <rect x="86" y="10" width="28" height="52" rx="14" transform="rotate(60 100 100)" />
    <rect x="86" y="10" width="28" height="52" rx="14" transform="rotate(120 100 100)" />
    <rect x="86" y="10" width="28" height="52" rx="14" transform="rotate(180 100 100)" />
    <rect x="86" y="10" width="28" height="52" rx="14" transform="rotate(240 100 100)" />
    <rect x="86" y="10" width="28" height="52" rx="14" transform="rotate(300 100 100)" />
  </g>
  <!-- Center Core Diamond Verification Node -->
  <path d="M100 78 Q100 100 78 100 Q100 100 100 122 Q100 100 122 100 Q100 100 100 78 Z" fill="#FFFFFF" filter="url(#favGlow)" />
</svg>