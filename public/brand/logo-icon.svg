<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 6 Radial Precision Sentinel Arms at 60 deg Harmonic Angles -->
  <rect x="89" y="24" width="22" height="44" rx="11" transform="rotate(0 100 100)" fill="url(#nexusGrad)" />
  <rect x="89" y="24" width="22" height="44" rx="11" transform="rotate(60 100 100)" fill="url(#nexusGrad)" />
  <rect x="89" y="24" width="22" height="44" rx="11" transform="rotate(120 100 100)" fill="url(#nexusGrad)" />
  <rect x="89" y="24" width="22" height="44" rx="11" transform="rotate(180 100 100)" fill="url(#nexusGrad)" />
  <rect x="89" y="24" width="22" height="44" rx="11" transform="rotate(240 100 100)" fill="url(#nexusGrad)" />
  <rect x="89" y="24" width="22" height="44" rx="11" transform="rotate(300 100 100)" fill="url(#nexusGrad)" />
  <!-- Central Deterministic Verification Diamond Spark -->
  <path d="M100 84 Q100 100 84 100 Q100 100 100 116 Q100 100 116 100 Q100 100 100 84 Z" fill="#FFFFFF" filter="url(#coreGlow)" />
</svg>